name: One-time park Meditate from Sound

on:
  push:
    branches:
      - releaf-development
    paths:
      - tool/one_time/park_meditate_sound.py
      - .github/workflows/one_time_park_meditate_sound.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: releaf-development
          fetch-depth: 0

      - name: Apply guarded Sound parking migration
        run: python tool/one_time/park_meditate_sound.py

      - name: Verify only intended product files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'lib/features/sound/presentation/sound_screen.dart\ntest/five_primary_destinations_test.dart'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Remove one-time migration machinery
        run: git rm tool/one_time/park_meditate_sound.py .github/workflows/one_time_park_meditate_sound.yml

      - name: Commit minimal GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/sound/presentation/sound_screen.dart test/five_primary_destinations_test.dart
          git commit -m "fix: park Meditate from Sound discovery"
          git push origin HEAD:releaf-development
