name: One-time remove stale Home import

on:
  push:
    branches:
      - releaf-development
    paths:
      - .github/workflows/one_time_remove_home_import.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: releaf-development
          fetch-depth: 0
      - name: Remove exactly one stale import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/home/home_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = "import '../../core/providers.dart';\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale import, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "lib/features/home/home_screen.dart"
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one_time_remove_home_import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/home_screen.dart
          git commit -m "fix: remove stale Home provider import"
          git push origin HEAD:releaf-development
