name: Import Stage 2 artwork

on:
  push:
    branches:
      - chatgpt/editorial-art-stage2

permissions:
  contents: write

jobs:
  import-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/editorial-art-stage2

      - name: Download approved editorial artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/art/relief
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/382e7f17-2369-4b1f-ad82-5796107ba76f.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzQ4NzQ3ZTg2YWYyODljMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc2NjUwNH0.viQTLEQGBjEM88A-1y5X0_eRBKVXY59CLM9OQAoNu44' -o assets/art/relief/reset.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d07e63e9-1dd4-40eb-964c-c5506a3177e3.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2JhYTFlMjAzYzM5MDc3NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgyNjA4MH0.WDh05btfMl1h6t5AziMEBmr5gWFQk0d211RxZJJJHto' -o assets/art/relief/body_scan.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/cd59c148-2b6c-4b5e-84de-4699b0152d57.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjA3ZTVlMzMwMTNlOTg1MSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc4MzA5MX0.nWI02TAvp-2m7UDO9ZPSD8dkrni3a5UIRvFw74v5bHY' -o assets/art/relief/brain_games.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/61cdd741-3dfc-40ff-a9c4-993b86cb997a.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNThkMDc0ZTBjNTJhYWRiZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc2NTIxNn0.PTdyQgc4ba2_ih-DU-gBYqT9m-gqW3AkgLA9SmmoTYs' -o assets/art/relief/breathe.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/7e44769b-ca6d-432c-bbdf-edddf2712969.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDJhOTg0ZDAyZmNhY2Q1MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgwOTc0NH0.F1E16njEFyv1V7ob5OtaGlabJFske_Mv-Wkv0gl4p0w' -o assets/art/relief/emergency_calm.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/5a99cfb7-433b-47ca-95e2-befc1e6402c3.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODExY2Q0MWVjYmU0OWQ4ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc3ODk3NH0.qDZg9uOxDA5dvJtVQc3fOUyM-Uds14yXQdOfobYiPX4' -o assets/art/relief/meditate.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/7e4fba6e-6838-43c4-965b-573cb3a4ddee.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjJmNGFhYzNjMWNmYzYzYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgyNjI0M30.Bi52ieYfNBm6QHm8g8k58Pja0QFkc8Vwd2tMdW5K8gk' -o assets/art/relief/sleep.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/07765c25-db18-439c-8ed3-c3f1a9d52835.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmUzMmEyM2NmMDkyZGUzMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgyNTQ2OH0.3IncnPXaJ5QjOOeRZoadMNTw0JsyoBp8mEsUwGFONMs' -o assets/art/relief/sleep_stories.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/cc9eb3e6-5f5f-4b37-94bc-bffa3c203a6c.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTU5ZTVkMTkzYmNkN2YzZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgwNzM4NX0.FBXdrpYK6wregzNK41SISZxBrLgALlLrAoK2z5Zv4Ro' -o assets/art/relief/soundscapes.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/8aff144a-ca14-49f2-a3ac-c2a451b5267a.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODlhZWE0YjllZWEzZTYwZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc4MzIyNX0.VYGZeOj6Yjp86nw6ieNk_8Mo4s0YoEWhpHmkq18IuUs' -o assets/art/relief/tension_relief.webp

      - name: Verify exact artwork hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.sha256 <<'EOF'
          b086c7498c86b2a02325169e8372d3210542dddac70e8ac0fbadb442e2df8850  assets/art/relief/body_scan.webp
          7d44f76aa8e08efea92c1a5fbe17519695451de0017eb5c078945ffc202bc47c  assets/art/relief/brain_games.webp
          786a30cc1b77ab39f4054b8d19a5d19af9bcca89fb13886079c79640f07937ba  assets/art/relief/breathe.webp
          5d918366279fe618ff06d53374da0ffe5966dcc99acdd86463d7f657cd551d57  assets/art/relief/emergency_calm.webp
          c39316c6a6b7fb42929d5ce3016793691025c39e17cacc707f712df73cc08d1a  assets/art/relief/meditate.webp
          08681b3ff52e226cf91dc0ec397cca9fde84f4e0baf5db3423632db0416ab9b8  assets/art/relief/reset.webp
          6c100b7eb9416fa0dd07c1e10dec96a4837b45559e33e1adba68ff3441d14b15  assets/art/relief/sleep.webp
          c77f7c35a9b8da8e3b9fe47c70e3ad0c25754ad023c2690cc7328b88679eda48  assets/art/relief/sleep_stories.webp
          ca75347eb32e097ba66baf6b0b0220e6cb0b14cb470628285e45a0a983ed3a7a  assets/art/relief/soundscapes.webp
          15e3403bcd477a81bb98120d711721775787c3d9f36172fb4a543276fb7c7545  assets/art/relief/tension_relief.webp
          EOF
          sha256sum -c /tmp/expected.sha256

      - name: Commit imported artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/relief
          git commit -m "assets: add approved editorial artwork"
          git push origin HEAD:chatgpt/editorial-art-stage2
