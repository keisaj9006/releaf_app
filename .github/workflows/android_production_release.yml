name: Build production Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release source and frozen version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "releaf-development" ]; then
            echo "::error::Production AAB must be built from releaf-development."
            exit 1
          fi
          grep -Fxq 'version: 1.0.0+20260913' pubspec.yaml || {
            echo "::error::Expected frozen Releaf 1.0 RC version: 1.0.0+20260913."
            exit 1
          }

      - name: Analyze
        run: flutter analyze

      - name: Run full test suite
        run: flutter test --reporter expanded

      - name: Validate production secrets
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            REVENUECAT_ANDROID_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub Actions secrets."
              exit 1
            fi
          done

          if [[ "$REVENUECAT_ANDROID_API_KEY" != goog_* ]]; then
            echo "::error::REVENUECAT_ANDROID_API_KEY must be a Google Play public SDK key beginning with goog_."
            exit 1
          fi

      - name: Materialize private upload signing configuration
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/keystores
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/keystores/releaf-upload.jks
          chmod 600 android/keystores/releaf-upload.jks
          {
            printf 'storeFile=../keystores/releaf-upload.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_UPLOAD_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_UPLOAD_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_UPLOAD_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Build signed production app bundle
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: >-
          flutter build appbundle --release
          --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Verify AAB signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          aab='build/app/outputs/bundle/release/app-release.aab'
          test -s "$aab"
          jarsigner -verify -strict "$aab"
          sha256sum "$aab" > "$aab.sha256"
          test -s "$aab.sha256"

      - name: Upload signed production AAB
        uses: actions/upload-artifact@v4
        with:
          name: releaf-1.0.0-20260913-production-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove private signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/keystores/releaf-upload.jks
