name: One-time align parked Meditate tests

on:
  push:
    branches:
      - releaf-development
    paths:
      - tool/one_time/align_parked_meditate_tests.py
      - .github/workflows/one_time_align_parked_meditate_tests.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: releaf-development
          fetch-depth: 0

      - name: Align stale Sound/Meditate test expectations
        run: python tool/one_time/align_parked_meditate_tests.py

      - name: Verify only intended test file changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "test/primary_wellbeing_tabs_test.dart"

      - name: Remove one-time migration machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm tool/one_time/align_parked_meditate_tests.py .github/workflows/one_time_align_parked_meditate_tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/primary_wellbeing_tabs_test.dart
          git commit -m "test: align Sound checks with parked Meditate"
          git push origin HEAD:releaf-development
