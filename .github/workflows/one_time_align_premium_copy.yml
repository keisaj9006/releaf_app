name: One-time align Premium copy

on:
  push:
    branches:
      - releaf-development
    paths:
      - tool/one_time/align_premium_copy.py
      - .github/workflows/one_time_align_premium_copy.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: releaf-development
          fetch-depth: 0

      - name: Apply guarded Premium copy migration
        run: python tool/one_time/align_premium_copy.py

      - name: Verify only paywall changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          if [[ "$changed" != "lib/core/paywall/presentation/paywall_sheet.dart" ]]; then
            echo "Unexpected changed files: $changed" >&2
            exit 1
          fi

      - name: Remove one-time migration machinery
        run: git rm tool/one_time/align_premium_copy.py .github/workflows/one_time_align_premium_copy.yml

      - name: Commit minimal GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/paywall/presentation/paywall_sheet.dart
          git commit -m "fix: align Premium copy with active Releaf pillars"
          git push origin HEAD:releaf-development
