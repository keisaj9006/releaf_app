name: Relief Web Release Smoke

on:
  push:
    branches:
      - releaf-development
  pull_request:
    branches:
      - releaf-development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releaf-web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-release-smoke:
    name: Build Relief web + deletion resource
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: releaf-development
          fetch-depth: 0

      - name: Apply approved Stories redesign
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore(ci): apply Stories redesign patch' }}"
        run: python3 tool/one_time/apply_sleep_stories_redesign.py

      - name: Commit approved Stories redesign
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore(ci): apply Stories redesign patch' }}"
        shell: bash
        run: |
          git config user.name "Relief CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/features/sleep/presentation/sleep_screen.dart \
            test/sleep_experience_test.dart
          git commit -m "feat(sleep): open focused Stories experience"
          git push origin HEAD:releaf-development

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web release
        run: flutter build web --release

      - name: Verify account deletion resource
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/delete-account.html
          grep -Fq 'href="/#/account"' build/web/delete-account.html
          grep -Fq 'You do not need the Android app installed.' build/web/delete-account.html
          if grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' build/web/delete-account.html; then
            echo "ERROR: service-role identifier leaked into public deletion resource." >&2
            exit 1
          fi

      - name: Upload web release smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: releaf-web-release-smoke
          path: build/web
          retention-days: 7
