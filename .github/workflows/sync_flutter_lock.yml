name: Sync Flutter lockfile

on:
  push:
    branches:
      - releaf-development
    paths:
      - pubspec.yaml
      - .github/workflows/sync_flutter_lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "build: sync Flutter dependency lockfile"
          git push origin HEAD:releaf-development
