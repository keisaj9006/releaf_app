name: Generate Releaf owned audio

on:
  push:
    branches:
      - releaf-development
    paths:
      - .github/workflows/generate_releaf_audio.yml

permissions:
  contents: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: releaf-development

      - name: Install audio encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate original Releaf loops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/sounds/generated
          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          from pathlib import Path

          random.seed(726451)
          rate = 22050
          duration = 12
          frames = rate * duration
          out = Path("assets/sounds/generated")

          def write_wav(name, samples):
              peak = max(1e-9, max(abs(v) for v in samples))
              scale = 0.82 / peak
              with wave.open(str(out / name), "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(rate)
                  wav.writeframes(b"".join(
                      struct.pack("<h", max(-32767, min(32767, int(v * scale * 32767))))
                      for v in samples
                  ))

          white = [random.gauss(0, 0.16) for _ in range(frames)]
          write_wav("white_noise.wav", white)

          rows = [random.uniform(-1, 1) for _ in range(12)]
          pink = []
          for i in range(frames):
              changed = (i + 1) & -(i + 1)
              row = min(11, int(math.log2(changed)) if changed else 0)
              rows[row] = random.uniform(-1, 1)
              pink.append(sum(rows) / len(rows))
          write_wav("pink_noise.wav", pink)

          drift = []
          for i in range(frames):
              t = i / rate
              slow = 0.72 + 0.18 * math.sin(2 * math.pi * t / duration)
              shimmer = 0.5 + 0.5 * math.sin(2 * math.pi * t / (duration / 2))
              sample = (
                  0.42 * math.sin(2 * math.pi * 110 * t) +
                  0.25 * math.sin(2 * math.pi * 165 * t + 0.6) +
                  0.17 * math.sin(2 * math.pi * 220 * t + 1.2) +
                  0.07 * shimmer * math.sin(2 * math.pi * 330 * t + 0.2)
              ) * slow
              drift.append(sample)
          write_wav("deep_drift.wav", drift)
          PY

          ffmpeg -hide_banner -loglevel error -y -i assets/sounds/generated/white_noise.wav -codec:a libmp3lame -b:a 64k assets/sounds/white_noise.mp3
          ffmpeg -hide_banner -loglevel error -y -i assets/sounds/generated/pink_noise.wav -codec:a libmp3lame -b:a 64k assets/sounds/pink_noise.mp3
          ffmpeg -hide_banner -loglevel error -y -i assets/sounds/generated/deep_drift.wav -codec:a libmp3lame -b:a 64k assets/sounds/deep_drift.mp3

          rm -rf assets/sounds/generated
          test -s assets/sounds/white_noise.mp3
          test -s assets/sounds/pink_noise.mp3
          test -s assets/sounds/deep_drift.mp3

      - name: Commit generated audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "releaf-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/sounds/white_noise.mp3 assets/sounds/pink_noise.mp3 assets/sounds/deep_drift.mp3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "asset: add owned noise and ambient loops"
          git push origin HEAD:releaf-development
