name: Deploy Releaf Web to GitHub Pages

on:
  push:
    branches:
      - releaf-development
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: releaf-web-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public Releaf web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze public web source
        run: flutter analyze

      - name: Test public web release contract
        run: flutter test --reporter expanded

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Flutter web for Pages
        shell: bash
        run: |
          set -euo pipefail
          base_path="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base_path" ]; then
            base_href="/"
          else
            base_href="${base_path%/}/"
          fi
          flutter build web --release --base-href "$base_href"

      - name: Make account deletion resource host-portable
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|href="/#/account"|href="./#/account"|' build/web/delete-account.html

      - name: Verify public web release
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/delete-account.html
          grep -Fq 'href="./#/account"' build/web/delete-account.html
          grep -Fq 'You do not need the Android app installed.' build/web/delete-account.html
          if grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' build/web/delete-account.html; then
            echo '::error::Service-role identifier leaked into the public deletion resource.'
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy public Releaf web
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
