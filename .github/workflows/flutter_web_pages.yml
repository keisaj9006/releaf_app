name: Deploy Releaf Web to GitHub Pages

on:
  push:
    branches:
      - releaf-development
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: releaf-web-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public Releaf web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze public web source
        run: flutter analyze

      - name: Test public web release contract
        run: flutter test --reporter expanded

      - name: Validate production legal metadata
        env:
          RELEAF_DATA_CONTROLLER_NAME: ${{ vars.RELEAF_DATA_CONTROLLER_NAME }}
          RELEAF_PRIVACY_CONTACT_EMAIL: ${{ vars.RELEAF_PRIVACY_CONTACT_EMAIL }}
          RELEAF_PRIVACY_POLICY_URL: ${{ vars.RELEAF_PRIVACY_POLICY_URL }}
          RELEAF_ACCOUNT_DELETION_URL: ${{ vars.RELEAF_ACCOUNT_DELETION_URL }}
          RELEAF_PRIVACY_LAST_UPDATED: ${{ vars.RELEAF_PRIVACY_LAST_UPDATED }}
        run: dart run tool/release/legal_metadata_policy.dart

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Flutter web for Pages
        shell: bash
        run: |
          set -euo pipefail
          base_path="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base_path" ]; then
            base_href="/"
          else
            base_href="${base_path%/}/"
          fi
          flutter build web --release --base-href "$base_href"

      - name: Render public Privacy Policy
        env:
          RELEAF_DATA_CONTROLLER_NAME: ${{ vars.RELEAF_DATA_CONTROLLER_NAME }}
          RELEAF_PRIVACY_CONTACT_EMAIL: ${{ vars.RELEAF_PRIVACY_CONTACT_EMAIL }}
          RELEAF_PRIVACY_POLICY_URL: ${{ vars.RELEAF_PRIVACY_POLICY_URL }}
          RELEAF_ACCOUNT_DELETION_URL: ${{ vars.RELEAF_ACCOUNT_DELETION_URL }}
          RELEAF_PRIVACY_LAST_UPDATED: ${{ vars.RELEAF_PRIVACY_LAST_UPDATED }}
        run: dart run tool/release/render_privacy_policy.dart build/web/privacy-policy.html

      - name: Make account deletion resource host-portable
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|href="/#/account"|href="./#/account"|' build/web/delete-account.html

      - name: Verify public web release
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/delete-account.html
          test -s build/web/privacy-policy.html
          grep -Fq 'href="./#/account"' build/web/delete-account.html
          grep -Fq 'You do not need the Android app installed.' build/web/delete-account.html
          grep -Fq '<title>Releaf Privacy Policy</title>' build/web/privacy-policy.html
          grep -Fq 'Information Commissioner' build/web/privacy-policy.html
          grep -Fq 'Delete your account' build/web/privacy-policy.html
          for file in build/web/delete-account.html build/web/privacy-policy.html; do
            if grep -Eq 'SUPABASE_SERVICE_ROLE_KEY|REVENUECAT_SECRET_API_KEY' "$file"; then
              echo "::error::Server-only credential identifier leaked into $file."
              exit 1
            fi
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy public Releaf web
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
