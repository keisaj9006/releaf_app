name: One-time Store Listing RED

on:
  push:
    branches:
      - releaf-development
    paths:
      - .github/workflows/one_time_store_listing_red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run Store Listing active-pillars RED contract
        run: flutter test test/google_play_store_listing_active_pillars_test.dart --reporter expanded
