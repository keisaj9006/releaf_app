name: Flutter P0 Validation

on:
  push:
    branches:
      - releaf-development
  pull_request:
    branches:
      - releaf-development

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check RevenueCat configuration
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          if [ -z "$REVENUECAT_ANDROID_API_KEY" ]; then
            echo "::warning::REVENUECAT_ANDROID_API_KEY is not configured. Premium purchase/restore will be unavailable in this APK."
          else
            echo "RevenueCat Android configuration detected."
          fi

      - name: Build Android debug APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: >
          flutter build apk --debug
          --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
