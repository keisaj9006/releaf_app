name: Flutter P0 Validation

on:
  push:
    branches:
      - releaf-development
  pull_request:
    branches:
      - releaf-development

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check RevenueCat configuration
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          if [ -z "$REVENUECAT_ANDROID_API_KEY" ]; then
            echo "::warning::REVENUECAT_ANDROID_API_KEY is not configured. Premium purchase/restore will be unavailable in this APK."
          else
            echo "RevenueCat Android configuration detected."
          fi

      - name: Build Android standard debug APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"
          mkdir -p build/qa-apks
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/qa-apks/releaf-debug-standard.apk

      - name: Build Android Premium Preview APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY" \
            --dart-define=RELEAF_PREMIUM_PREVIEW=true
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/qa-apks/releaf-debug-premium-preview.apk

      - name: Upload Android standard debug APK
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-debug-standard
          path: build/qa-apks/releaf-debug-standard.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Premium Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-debug-premium-preview
          path: build/qa-apks/releaf-debug-premium-preview.apk
          if-no-files-found: error
          retention-days: 7
