name: Flutter P0 Validation

on:
  push:
    branches:
      - releaf-development
  pull_request:
    branches:
      - releaf-development

concurrency:
  group: flutter-p0-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is in sync with pubspec.yaml."
            exit 0
          fi

          echo "::error::pubspec.lock changed after flutter pub get. Commit the resolved lockfile."
          git diff -- pubspec.lock
          exit 1

      - name: Audit bundled sound assets
        timeout-minutes: 5
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          printf "file\tduration_s\tbitrate_bps\tsample_rate_hz\tchannels\tsize_bytes\n"
          failed=0
          for file in assets/sounds/*.mp3; do
            duration="$(timeout 20s ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            bitrate="$(timeout 20s ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            sample_rate="$(timeout 20s ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            channels="$(timeout 20s ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            size="$(stat -c%s "$file")"

            printf "%s\t%s\t%s\t%s\t%s\t%s\n" \
              "$file" "$duration" "$bitrate" "$sample_rate" "$channels" "$size"

            if [ -z "$duration" ] || [ -z "$sample_rate" ] || [ -z "$channels" ]; then
              echo "::error file=$file::Unable to decode bundled sound asset."
              failed=1
              continue
            fi

            if ! awk "BEGIN { exit !($duration >= 60) }"; then
              echo "::error file=$file::Bundled looping sound must be at least 60 seconds."
              failed=1
            fi

            if [ "$sample_rate" != "44100" ]; then
              echo "::warning file=$file::Expected 44.1 kHz bundled audio; got $sample_rate Hz."
            fi
          done

          exit "$failed"

      - name: Analyze
        run: flutter analyze

      - name: Test Brain
        timeout-minutes: 5
        run: flutter test test/brain_flow_test.dart test/memory_stats_test.dart --reporter expanded

      - name: Test Reset model
        timeout-minutes: 5
        run: >-
          flutter test
          test/reset_audio_preferences_test.dart
          test/reset_catalog_test.dart
          test/reset_session_engine_test.dart
          --reporter expanded

      - name: Test Reset hub
        timeout-minutes: 5
        run: flutter test test/reset_hub_test.dart --reporter expanded

      - name: Test Reset access
        timeout-minutes: 5
        run: flutter test test/relief_access_test.dart --reporter expanded

      - name: Test full suite
        timeout-minutes: 5
        run: flutter test --reporter expanded

      - name: Export Releaf Guide production manifest
        run: >-
          flutter test
          test/meditation_narration_manifest_export_test.dart
          --reporter expanded

      - name: Upload Releaf Guide production manifest
        uses: actions/upload-artifact@v4
        with:
          name: releaf-guide-production-manifest
          path: build/qa-manifests/releaf-guide-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Export Reset demo production manifest
        run: >-
          flutter test
          test/reset_demo_manifest_export_test.dart
          --reporter expanded

      - name: Upload Reset demo production manifest
        uses: actions/upload-artifact@v4
        with:
          name: releaf-reset-demo-production-manifest
          path: build/qa-manifests/reset-demo-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Check RevenueCat configuration
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          if [ -z "$REVENUECAT_ANDROID_API_KEY" ]; then
            echo "::warning::REVENUECAT_ANDROID_API_KEY is not configured. Premium purchase/restore will be unavailable in this APK."
          else
            echo "RevenueCat Android configuration detected."
          fi

      - name: Build Android standard debug APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"
          mkdir -p build/qa-apks
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/qa-apks/releaf-debug-standard.apk

      - name: Build Android Premium Preview APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY" \
            --dart-define=RELEAF_PREMIUM_PREVIEW=true
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/qa-apks/releaf-debug-premium-preview.apk

      - name: Upload Android standard debug APK
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-debug-standard
          path: build/qa-apks/releaf-debug-standard.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Premium Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-debug-premium-preview
          path: build/qa-apks/releaf-debug-premium-preview.apk
          if-no-files-found: error
          retention-days: 7
