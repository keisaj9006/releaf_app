name: Flutter P0 Validation

on:
  push:
    branches:
      - releaf-development
  pull_request:
    branches:
      - releaf-development

concurrency:
  group: flutter-p0-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is in sync with pubspec.yaml."
            exit 0
          fi

          echo "::error::pubspec.lock changed after flutter pub get. Commit the resolved lockfile."
          git diff -- pubspec.lock
          exit 1

      - name: Audit bundled sound assets
        timeout-minutes: 5
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          printf "file\tduration_s\tbitrate_bps\tsample_rate_hz\tchannels\tsize_bytes\n"
          failed=0
          for file in assets/sounds/*.mp3; do
            duration="$(timeout 20s ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            bitrate="$(timeout 20s ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            sample_rate="$(timeout 20s ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            channels="$(timeout 20s ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 "$file" || true)"
            size="$(stat -c%s "$file")"

            printf "%s\t%s\t%s\t%s\t%s\t%s\n" \
              "$file" "$duration" "$bitrate" "$sample_rate" "$channels" "$size"

            if [ -z "$duration" ] || [ -z "$sample_rate" ] || [ -z "$channels" ]; then
              echo "::error file=$file::Unable to decode bundled sound asset."
              failed=1
              continue
            fi

            if ! awk "BEGIN { exit !($duration >= 60) }"; then
              echo "::error file=$file::Bundled looping sound must be at least 60 seconds."
              failed=1
            fi

            if [ "$sample_rate" != "44100" ]; then
              echo "::warning file=$file::Expected 44.1 kHz bundled audio; got $sample_rate Hz."
            fi
          done

          exit "$failed"

      - name: Audit Android release configuration
        run: |
          grep -q 'compileSdk = 36' android/app/build.gradle.kts || {
            echo "::error::Android compileSdk must be API 36 for the 2026 release baseline."
            exit 1
          }
          grep -q 'targetSdk = 36' android/app/build.gradle.kts || {
            echo "::error::Android targetSdk must be API 36 for Google Play submissions."
            exit 1
          }
          grep -q 'android:name="com.android.vending.BILLING"' android/app/src/main/AndroidManifest.xml || {
            echo "::error::Google Play Billing permission is required for RevenueCat purchases."
            exit 1
          }
          grep -q 'android:launchMode="singleTop"' android/app/src/main/AndroidManifest.xml || {
            echo "::error::Purchase Activity must use standard or singleTop launch mode; Releaf baseline is singleTop."
            exit 1
          }
          grep -q 'ndkVersion = "28.2.13676358"' android/app/build.gradle.kts || {
            echo "::error::Android release baseline must use NDK r28+ for default 16 KB ELF alignment."
            exit 1
          }
          if grep -q 'signingConfig = signingConfigs.getByName("debug")' android/app/build.gradle.kts; then
            echo "::error::Release artifacts must never use the debug signing key."
            exit 1
          fi
          git check-ignore -q android/key.properties || {
            echo "::error::android/key.properties must stay ignored."
            exit 1
          }

      - name: Analyze
        run: flutter analyze

      - name: Test Brain
        timeout-minutes: 5
        run: flutter test test/brain_flow_test.dart test/memory_stats_test.dart --reporter expanded

      - name: Test Reset model
        timeout-minutes: 5
        run: >-
          flutter test
          test/reset_audio_preferences_test.dart
          test/reset_catalog_test.dart
          test/reset_session_engine_test.dart
          test/reset_voice_playback_test.dart
          test/reset_lifecycle_test.dart
          --reporter expanded

      - name: Test Reset hub
        timeout-minutes: 5
        run: flutter test test/reset_hub_test.dart --reporter expanded

      - name: Test Reset access
        timeout-minutes: 5
        run: flutter test test/relief_access_test.dart --reporter expanded

      - name: Test full suite
        timeout-minutes: 5
        run: flutter test --reporter expanded

      - name: Export Releaf Guide production manifest
        run: >-
          flutter test
          test/meditation_narration_manifest_export_test.dart
          --reporter expanded

      - name: Upload Releaf Guide production manifest
        uses: actions/upload-artifact@v4
        with:
          name: releaf-guide-production-manifest
          path: build/qa-manifests/releaf-guide-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Export Reset Releaf Guide production manifest
        run: >-
          flutter test
          test/reset_narration_manifest_export_test.dart
          --reporter expanded

      - name: Upload Reset Releaf Guide production manifest
        uses: actions/upload-artifact@v4
        with:
          name: releaf-reset-guide-production-manifest
          path: build/qa-manifests/reset-releaf-guide-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Export Reset demo production manifest
        run: >-
          flutter test
          test/reset_demo_manifest_export_test.dart
          --reporter expanded

      - name: Upload Reset demo production manifest
        uses: actions/upload-artifact@v4
        with:
          name: releaf-reset-demo-production-manifest
          path: build/qa-manifests/reset-demo-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Check RevenueCat configuration
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          if [ -z "$REVENUECAT_ANDROID_API_KEY" ]; then
            echo "::warning::REVENUECAT_ANDROID_API_KEY is not configured. Premium purchase/restore will be unavailable in this APK."
          else
            echo "RevenueCat Android configuration detected."
          fi

      - name: Build Android standard debug APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"
          mkdir -p build/qa-apks
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/qa-apks/releaf-debug-standard.apk

      - name: Build Android Premium Preview APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY" \
            --dart-define=RELEAF_PREMIUM_PREVIEW=true
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/qa-apks/releaf-debug-premium-preview.apk

      - name: Upload Android standard debug APK
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-debug-standard
          path: build/qa-apks/releaf-debug-standard.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Premium Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-debug-premium-preview
          path: build/qa-apks/releaf-debug-premium-preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Android release AAB smoke artifact
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-upload-keystore.jks \
            -storepass changeit \
            -keypass changeit \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Releaf CI, OU=QA, O=Releaf, L=Edinburgh, ST=Scotland, C=GB"

          cat > android/key.properties <<'EOF'
          storePassword=changeit
          keyPassword=changeit
          keyAlias=upload
          storeFile=ci-upload-keystore.jks
          EOF

          flutter build appbundle --release \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

          rm -f android/key.properties android/ci-upload-keystore.jks

      - name: Verify Android release 16 KB compatibility
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          # Re-create a short-lived CI signing key because the AAB smoke step
          # removes its credentials after use.
          keytool -genkeypair -v \
            -keystore android/ci-upload-keystore.jks \
            -storepass changeit \
            -keypass changeit \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Releaf CI, OU=QA, O=Releaf, L=Edinburgh, ST=Scotland, C=GB"

          cat > android/key.properties <<'EOF'
          storePassword=changeit
          keyPassword=changeit
          keyAlias=upload
          storeFile=ci-upload-keystore.jks
          EOF

          flutter build apk --release \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

          APK="build/app/outputs/flutter-apk/app-release.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$ZIPALIGN" || {
            echo "::error::zipalign was not found in Android SDK build-tools."
            exit 1
          }
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          rm -rf build/qa-16kb-apk
          mkdir -p build/qa-16kb-apk
          unzip -q "$APK" 'lib/*/*.so' -d build/qa-16kb-apk

          OBJDUMP="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          test -x "$OBJDUMP" || {
            echo "::error::NDK r28 llvm-objdump was not found."
            exit 1
          }

          failed=0
          native_count=0
          while IFS= read -r so; do
            native_count=$((native_count + 1))
            echo "Checking ELF LOAD alignment: $so"
            exponents="$(
              "$OBJDUMP" -p "$so" |
                sed -n 's/.*LOAD.*align 2\*\*\([0-9][0-9]*\).*/\1/p'
            )"

            if [ -z "$exponents" ]; then
              echo "::error file=$so::Unable to read ELF LOAD segment alignment."
              failed=1
              continue
            fi

            while IFS= read -r exponent; do
              if [ "$exponent" -lt 14 ]; then
                echo "::error file=$so::ELF LOAD segment alignment 2**$exponent is below the required 2**14 (16 KB)."
                failed=1
              fi
            done <<< "$exponents"
          done < <(find build/qa-16kb-apk -type f -name '*.so' | sort)

          if [ "$native_count" -eq 0 ]; then
            echo "::error::Release APK contains no native libraries to verify; 16 KB check would be meaningless."
            failed=1
          fi

          rm -f android/key.properties android/ci-upload-keystore.jks
          exit "$failed"

      - name: Upload Android release AAB smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: releaf-android-release-aab-smoke
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
